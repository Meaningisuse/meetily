name: Internal enhancement checks
on:
  pull_request:
  push:
    branches: [pro, 'codex/**']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install native build tool
        run: python -m pip install cmake==3.31.6
      - name: Install locked frontend dependencies
        run: pnpm -C frontend install --frozen-lockfile
      - name: Verify enhancements
        run: scripts/check-enhancement.sh --all
